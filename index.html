<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Básico -->
    <title>Meu E-Commerce — Delivery</title>
    <meta name="description" content="Faça suas compras online e receba em casa! Produtos frescos, ofertas exclusivas e entrega rápida." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (preview no WhatsApp, Instagram, Facebook) -->
    <meta property="og:title" content="Meu E-Commerce — Delivery" />
    <meta property="og:description" content="Faça suas compras online e receba em casa! Qualidade e economia para você." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <!-- PWA & Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Meu E-Commerce">
    <link rel="apple-touch-icon" href="/icons/icon-app.png">
    <meta name="theme-color" content="#374151">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
      // Carrega manifesto dinâmico dependendo da rota
      (function() {
        const isAdmin = window.location.pathname.startsWith('/admin');
        const manifestHref = isAdmin ? '/manifest-admin.json' : '/manifest.json';
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestHref;
        document.head.appendChild(link);
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icons/icon-app.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
