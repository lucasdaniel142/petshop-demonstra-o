query ProductDetails($productId: UUID!) @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public as it only retrieves product details.") {
  product(id: $productId) {
    id
    name
    description
    price
    imageUrl
    category
    stockQuantity
  }
}

query MyCart @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users as it fetches their own cart based on auth.uid.") {
  carts(where: {userId: {eq_expr: "auth.uid"}}) {
    id
    createdAt
    updatedAt
    cartItems_on_cart {
      id
      quantity
      product {
        id
        name
        price
      }
    }
  }
}

mutation AddItemToCart($cartId: UUID!, $productId: UUID!, $quantity: Int!) @auth(level: USER) {
  cartItem_insert(data: {
    cartId: $cartId,
    productId: $productId,
    quantity: $quantity,
    createdAt_expr: "request.time",
    updatedAt_expr: "request.time"
  }) {
    id
  }
}

mutation CreateNewUser($email: String!, $passwordHash: String!, $firstName: String, $lastName: String) @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public for new user registration.") {
  user_insert(data: {
    email: $email,
    passwordHash: $passwordHash,
    firstName: $firstName,
    lastName: $lastName,
    createdAt_expr: "request.time"
  }) {
    id
  }
}